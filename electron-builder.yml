appId: com.gemvtuber.app
productName: GemVTuber
copyright: Copyright (c) 2025 GemVTuber Contributors

directories:
  output: release

files:
  - src/**/*
  - assets/**/*
  - models/default/**/*
  - dist/renderer/**/*
  - package.json

win:
  target:
    - nsis
    - portable

mac:
  target:
    - dmg

linux:
  target:
    - AppImage
    - deb
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
