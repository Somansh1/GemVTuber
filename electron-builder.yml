appId: com.gemvtuber.app
productName: GemVTuber
copyright: Copyright © 2025

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - models/default/**/*
  - package.json

win:
  target:
    - nsis
    - portable
  icon: assets/icons/icon.ico

mac:
  target:
    - dmg
  icon: assets/icons/icon.icns

linux:
  target:
    - AppImage
    - deb
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
